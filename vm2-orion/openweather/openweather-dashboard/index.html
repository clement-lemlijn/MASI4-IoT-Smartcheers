<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Météo OpenWeather</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🌤️ Dashboard Météo</h1>
        <div class="search">
            <input type="text" id="city" placeholder="Ville (ex: Paris, London, Tokyo)" value="Liège">
            <button onclick="getWeather()">Chercher</button>
        </div>
        <div id="weather" class="weather-card"></div>
        <div id="forecast" class="forecast"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
