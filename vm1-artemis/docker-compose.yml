# docker-compose.yml sur Artemis
services:
  mongodb-smartcheers:
    image: mongo:7
    container_name: mongo-smartcheers
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PWD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_smartcheers_data:/data/db
    env_file:
      - .env

volumes:
  mongo_smartcheers_data: